name: RUN

options:
  bundleIdPrefix: com.kiddo56
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  TrackerCore:
    path: Packages/TrackerCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    RUN_GIT_COMMIT_SHA: "dev"
    INFOPLIST_EXPAND_BUILD_SETTINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic

targets:
  RUN:
    type: application
    platform: iOS
    sources:
      - path: RUN
        excludes:
          - Info.plist
    dependencies:
      - package: TrackerCore
        product: TrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddo56.run
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: RUN/Info.plist
      properties:
        CFBundleDisplayName: RUN
        CFBundleName: RUN
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        RunGitCommitSHA: "$(RUN_GIT_COMMIT_SHA)"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - bluetooth-central
        NSLocationWhenInUseUsageDescription: "RUN uses your location while tracking activities to record distance, pace, elevation, and your route."
        NSLocationAlwaysAndWhenInUseUsageDescription: "RUN can continue tracking your activity when the screen is locked or the app is in the background."
        NSLocationTemporaryUsageDescriptionDictionary:
          WorkoutTracking: "RUN needs full location precision to plot your route and compute accurate pace and distance."
        NSBluetoothAlwaysUsageDescription: "RUN optionally connects to Bluetooth heart-rate straps when enabled in Settings."
        NSMotionUsageDescription: "RUN optionally uses the barometer to refine elevation gain when enabled in Settings."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

  RUNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RUNTests
    dependencies:
      - target: RUN
      - package: TrackerCore
        product: TrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddo56.run.tests
        GENERATE_INFOPLIST_FILE: YES

  RUNUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RUNUITests
    dependencies:
      - target: RUN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiddo56.run.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RUN

schemes:
  RUN:
    build:
      targets:
        RUN: all
        RUNTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RUNTests
    archive:
      config: Release
